<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Tuan Nguyen</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <header>
      <!-- Show search + back button (for shows view) -->
      <input type="text" id="show-search" placeholder="Search shows..." />
      <button id="back-to-shows" style="display: none">Back to shows</button>

      <!-- Episode search + controls (for episodes view) -->
      <input type="text" id="search" placeholder="Search episodes..." />
      <span id="episode-count"></span>
      <select id="show-selector"></select>
      <select id="episode-selector"></select>
    </header>

    <div id="root"></div>

    
    <script src="script.js"></script>
  </body>
</html>
